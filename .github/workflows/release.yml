name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Validate version tag
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=boss-job-helper/ "$GITHUB_REF_NAME" > "dist/boss-job-helper-$GITHUB_REF_NAME.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" boss-helper.user.js "dist/boss-job-helper-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
